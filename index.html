<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocapn Plugin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #00ff88;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            color: #00ff88;
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        h2 {
            color: #00d4ff;
            font-size: 16px;
            margin: 15px 0 10px 0;
        }
        .card {
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            background: #0f0f0f;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            border: 1px solid #333;
            padding: 15px;
            text-align: center;
            background: #0f0f0f;
        }
        .stat-value {
            font-size: 32px;
            color: #00ff88;
        }
        .stat-label {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        .service-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border: 1px solid #333;
            background: #0f0f0f;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.healthy { background: #00ff88; }
        .dot.warning { background: #ffaa00; }
        .dot.error { background: #ff4444; }
        .dot.unknown { background: #666; }
        .plugin-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #333;
            background: #0f0f0f;
        }
        .plugin-list::-webkit-scrollbar {
            width: 8px;
        }
        .plugin-list::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .plugin-list::-webkit-scrollbar-thumb {
            background: #333;
        }
        .plugin-item {
            padding: 6px 10px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .plugin-item:last-child {
            border-bottom: none;
        }
        .plugin-name {
            color: #00d4ff;
        }
        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .badge.service { background: #00d4ff; color: #000; }
        .badge.shell { background: #00ff88; color: #000; }
        .badge.kernel { background: #ffaa00; color: #000; }
        .badge.web { background: #ff00ff; color: #000; }
        .badge.doc { background: #888; color: #000; }
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        .room-card {
            border: 1px solid #333;
            padding: 10px;
            background: #0f0f0f;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .room-card:hover {
            border-color: #00ff88;
        }
        .room-name {
            color: #00d4ff;
            font-size: 12px;
        }
        .room-tiles {
            color: #00ff88;
            font-size: 20px;
            margin-top: 5px;
        }
        .chart-container {
            position: relative;
            height: 200px;
            margin-top: 10px;
        }
        a {
            color: #00d4ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 900px) {
            .two-col {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>⚓ Cocapn Plugin Dashboard</h1>

    <div class="stats-grid">

            </div>
            <div class="service-item">

            <div class="service-item">

            </div>
            <div class="service-item">
                <div class="dot unknown"></div>

        </div>
    </div>

    <div class="two-col">
        <div class="card">
            <h2>▣ PLATO Rooms</h2>
            <div class="rooms-grid" id="roomsGrid">
                <!-- Populated by JS -->
            </div>
        </div>

        <div class="card">
            <h2>▣ Fleet Growth</h2>
            <div class="chart-container">
                <canvas id="growthChart"></canvas>
            </div>
        </div>
    </div>

        // Fleet growth data (last 12 weeks)
        const growthData = {
            labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6', 'Week 7', 'Week 8', 'Week 9', 'Week 10', 'Week 11', 'Week 12'],

        // Render plugin list
        function renderPlugins() {
            const container = document.getElementById('pluginList');
            let html = '';

            plugins.forEach(plugin => {
                const betaStr = plugin.beta !== undefined ? `<span style="color:#ffaa00">β:${plugin.beta.toFixed(2)}</span>` : '';
                html += `
                    <div class="plugin-item">
                        <span class="plugin-name">${plugin.name}</span>
                        <span>
                            <span class="badge ${plugin.family}">${plugin.family}</span>
                            ${betaStr}
                        </span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Render rooms
        function renderRooms() {
            const container = document.getElementById('roomsGrid');
            let html = '';

            rooms.forEach(room => {
                html += `
                    <div class="room-card" onclick="alert('Room: ${room.name}\\nTiles: ${room.tiles}')">
                        <div class="room-name">${room.name}</div>
                        <div class="room-tiles">${room.tiles}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Render growth chart
        function renderGrowthChart() {
            const ctx = document.getElementById('growthChart').getContext('2d');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: growthData.labels,
                    datasets: [
                        {
                            label: 'Plugins',
                            data: growthData.plugins,
                            borderColor: '#00ff88',
                            backgroundColor: 'rgba(0, 255, 136, 0.1)',
                            fill: true,
                            tension: 0.3
                        },
                        {
                            label: 'Tiles',
                            data: growthData.tiles,
                            borderColor: '#00d4ff',
                            backgroundColor: 'rgba(0, 212, 255, 0.1)',
                            fill: true,
                            tension: 0.3,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#888', font: { family: 'Courier New' } }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#666', font: { family: 'Courier New' } },
                            grid: { color: '#222' }
                        },
                        y: {
                            ticks: { color: '#00ff88', font: { family: 'Courier New' } },
                            grid: { color: '#222' }
                        },
                        y1: {
                            position: 'right',
                            ticks: { color: '#00d4ff', font: { family: 'Courier New' } },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }

        // Init
        renderPlugins();
        renderRooms();
        renderGrowthChart();
    </script>
</body>
</html>
